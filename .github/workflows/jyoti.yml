name: "infrapipeline"
on: workflow_dispatch

jobs: 
  terraform-job:
    runs-on: self-hosted
    permissions:
     id-token: write
     contents: read
    steps:
       - name: Checkout
         uses: actions/checkout@v5.0.0
       - name: Install Terraform
         uses: little-core-labs/install-terraform@v2.0.0
